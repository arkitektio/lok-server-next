# Base URL of the kontrol SPA. All account email links (verify-email, password
# reset, signup) and invite/organization redirects derive from it. Set to your
# frontend origin per deployment, e.g. https://go.arkitekt.live. The default '/'
# keeps links same-origin for local/dev.
# kontrol_frontend_url: "https://go.arkitekt.live"

account:
  email_verification: none
  # Identifier(s) users log in with. Default is username login.
  # To enable login via email with verification, set:
  #   login_methods: [email]
  #   email_verification: mandatory   # requires the `email:` SMTP block below
  # signup_fields is derived from login_methods when omitted.
  login_methods: [username]
  login_by_code_enabled: true
  mfa_trust_enabled: true
  # SPA URLs allauth points users at ({key} is filled in by allauth) default to
  # relative paths joined to `kontrol_frontend_url` (see below), so you normally
  # only set that one base URL. Override an individual flow here only if it must
  # live on a different host — an absolute value (with scheme) is used verbatim:
  #   headless_frontend_urls:
  #     account_confirm_email: https://other-host/account/verify-email/{key}
  # NOTE: the `saml` app imports `onelogin.saml2` at module scope, so it only
  # works with the `saml` extra installed (see pyproject.toml). It is listed
  # here — not just in the deployment config — because settings_test.py reads
  # this file, and without it `reverse("saml_metadata")` raises NoReverseMatch
  # in every SAML test.
  social_provider_apps:
  - allauth.socialaccount.providers.orcid
  - allauth.socialaccount.providers.google
  - allauth.socialaccount.providers.saml

# Policy for integrated login widgets that load third-party scripts and can track
# before a click (e.g. Google One Tap). strict = never load; opt-in = consent
# prompt first (default); disabled = load freely. Redirect buttons are unaffected.
privacy_guards: opt-in

# OIDC/OAuth2 clients provisioned on boot. Provide the client(s), secret(s) and
# redirect_uris per deployment (see the `ensureopenid` command).
openid_apps:
- client_name: Lok Frontend
  client_id: lok-frontend
  client_secret: change-me-per-deployment
  redirect_uris:
  - http://localhost:3000/auth/callback
