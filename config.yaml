  # (login_methods: [email]); it is provisioned as verified + primary.
  email: demo@example.com
  active_organization: default
  memberships:
  - organization: default
    roles: ["admin"]

authentikate:
  # authentikate 4.0 requires AUDIENCE. "*" (ANY_AUDIENCE) accepts a token minted
  # for any service; the `aud` claim itself is still required. Replace with this
  # service's identifier to check which service the token was minted for.
  audience: "*"
  issuers:
  - kind: rsa
    iss: lok
    kid: lok-key-1
    public_key: ssh-rsa  lok-example
  static_tokens: {}
